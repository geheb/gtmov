[package]
name = "gtmov"
version = "0.0.1"
edition = "2024"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
rust-embed = "8"
mime_guess = "2"
# actix-files nicht mehr nötig - static files sind embedded
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }
regex = "1"
tmdb-api = "0.9.1"
chrono = "0.4.44"
reqwest = "0.13.2"
open = "5"
async-stream = "0.3"
bytes = "1"
sysinfo = { version = "0.34", default-features = false, features = ["disk"] }
